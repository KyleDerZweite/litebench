name: Deploy LiteBench Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preserved generations
        run: python3 bench.py check
      - name: Validate current evaluations
        run: python3 bench.py evaluation-check
      - name: Run offline self-test
        run: python3 bench.py self-test
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/configure-pages@v5
      - name: Install visualizer dependencies
        run: bun install --frozen-lockfile
        working-directory: visualizer
      - name: Build static visualizer
        run: bun run build:pages
        working-directory: visualizer
      - uses: actions/upload-pages-artifact@v4
        with:
          path: visualizer/out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
